# ---------------------------------------------------------------------------
# Pull request pipeline.
#
# Ordering is deliberate: the cheap checks that fail most often run first, so a
# typo fails in 40 seconds rather than after a six-minute integration suite.
# Nothing here needs AWS credentials - a fork PR runs the whole thing.
# ---------------------------------------------------------------------------
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  # A new push supersedes the run in flight; no point testing a stale commit.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.4'

jobs:
  lint-and-typecheck:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.15.4' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build:shared
      - name: Generate Prisma clients
        run: pnpm prisma:generate
      - run: pnpm lint
      - run: pnpm typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.15.4' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build:shared
      - run: pnpm prisma:generate
      - run: pnpm test

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lp
          POSTGRES_PASSWORD: lp_password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.15.4' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Create per-service databases
        run: |
          for db in auth_db course_db enrollment_db payment_db media_db lab_db quiz_db certificate_db notification_db; do
            PGPASSWORD=lp_password psql -h localhost -U lp -d postgres -c "CREATE DATABASE $db;"
          done
      - name: Prepare env
        run: cp .env.example .env
      - run: pnpm build:shared
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - name: Run e2e API tests
        run: pnpm -r --no-bail test:e2e:api

  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with: { version: '9.15.4' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile=false

      - name: Dependency audit
        # Advisory, not blocking: a transitive low-severity finding should not
        # stop a hotfix. High and critical are enforced in the nightly job.
        run: pnpm audit --audit-level high || true

      - name: Static analysis (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/typescript p/nodejs p/owasp-top-ten p/secrets

      - name: Filesystem vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy-fs.sarif }

  docker-build:
    name: Build images
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - course-service
          - enrollment-service
          - payment-service
          - media-service
          - lab-service
          - quiz-service
          - certificate-service
          - notification-service
          - web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          # PRs build but never push. Publishing happens only from main.
          push: false
          load: true
          tags: lp/${{ matrix.service }}:pr-${{ github.event.number || github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: lp/${{ matrix.service }}:pr-${{ github.event.number || github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '1.10.3' }
      - name: Format check
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Validate each environment
        run: |
          for env in infra/terraform/environments/*/; do
            echo "== $env"
            terraform -chdir="$env" init -backend=false
            terraform -chdir="$env" validate
          done
      - name: Policy scan (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/terraform
          framework: terraform
          soft_fail: true

  kubernetes-manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests
        uses: instrumenta/kubeval-action@master
        with:
          files: infra/kubernetes
      - name: Security policy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: infra/kubernetes
          severity: HIGH,CRITICAL
          exit-code: '0'
