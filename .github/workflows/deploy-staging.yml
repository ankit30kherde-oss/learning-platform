# ---------------------------------------------------------------------------
# main -> staging.
#
# Images are tagged with the commit SHA, never `latest`. A mutable tag means
# you cannot tell which code is running in a pod, which turns every incident
# into an archaeology exercise.
#
# Authentication uses GitHub OIDC assuming an AWS role. There are no long-lived
# AWS keys in this repository's secrets, by design.
# ---------------------------------------------------------------------------
name: Deploy to staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC

concurrency:
  group: deploy-staging
  cancel-in-progress: false   # never interrupt a deploy mid-rollout

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: lp-staging
  NAMESPACE: learning-platform

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    strategy:
      fail-fast: true
      matrix:
        service:
          - api-gateway
          - auth-service
          - course-service
          - enrollment-service
          - payment-service
          - media-service
          - lab-service
          - quiz-service
          - certificate-service
          - notification-service
          - web
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          provenance: true          # supply-chain attestation
          sbom: true
          tags: ${{ steps.ecr.outputs.registry }}/lp/${{ matrix.service }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan pushed image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/lp/${{ matrix.service }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  migrate:
    name: Run database migrations
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION
      - name: Apply migrations as a Job
        # Migrations run once, in-cluster, before any new pod starts - not in an
        # init container, which would run once per replica and race itself.
        run: |
          sed -e "s|__IMAGE_TAG__|${{ needs.build-and-push.outputs.image_tag }}|g" \
              -e "s|__REGISTRY__|${{ secrets.ECR_REGISTRY }}|g" \
              infra/kubernetes/jobs/migrate.yaml | kubectl apply -f -
          kubectl -n $NAMESPACE wait --for=condition=complete job/db-migrate-${{ needs.build-and-push.outputs.image_tag }} --timeout=600s

  deploy:
    name: Rolling deploy
    needs: [build-and-push, migrate]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Apply manifests
        run: |
          kubectl apply -k infra/kubernetes/overlays/staging
          for svc in api-gateway auth-service course-service enrollment-service \
                     payment-service media-service lab-service quiz-service \
                     certificate-service notification-service web; do
            kubectl -n $NAMESPACE set image deployment/$svc \
              $svc=${{ secrets.ECR_REGISTRY }}/lp/$svc:${{ needs.build-and-push.outputs.image_tag }}
          done

      - name: Wait for rollout
        id: rollout
        run: |
          for svc in api-gateway auth-service course-service enrollment-service \
                     payment-service media-service lab-service quiz-service \
                     certificate-service notification-service web; do
            kubectl -n $NAMESPACE rollout status deployment/$svc --timeout=300s
          done

      - name: Smoke test
        run: |
          BASE=${{ secrets.STAGING_BASE_URL }}
          set -e
          curl -fsS "$BASE/healthz" > /dev/null
          curl -fsS "$BASE/api/courses" > /dev/null
          echo "smoke tests passed"

      - name: Roll back on failure
        if: failure() && steps.rollout.conclusion != 'skipped'
        run: |
          for svc in api-gateway auth-service course-service enrollment-service \
                     payment-service media-service lab-service quiz-service \
                     certificate-service notification-service web; do
            kubectl -n $NAMESPACE rollout undo deployment/$svc || true
          done
          echo "::error::Deployment failed; rolled back to the previous revision."
