# ---------------------------------------------------------------------------
# One public entry point. TLS terminates at the ALB (ACM certificate), WAF sits
# in front of it, and only the gateway and the web app are routable.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: learning-platform
  namespace: learning-platform
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: ACM_CERTIFICATE_ARN
    alb.ingress.kubernetes.io/wafv2-acl-arn: WAF_ACL_ARN
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    # The lab terminal is a long-lived WebSocket; the default 60s idle timeout
    # would drop a student mid-command.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600
spec:
  rules:
    - host: devopsacademy.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: api-gateway, port: { number: 4000 } } }
          - path: /labs/ws
            pathType: Prefix
            backend: { service: { name: api-gateway, port: { number: 4000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 3000 } } }
