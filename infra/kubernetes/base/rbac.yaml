# ---------------------------------------------------------------------------
# Least privilege, service by service.
#
# Almost every service needs nothing from the Kubernetes API. lab-service is the
# exception, and its permissions are the interesting part: it can create and
# delete namespaces and the objects inside them, and it can exec into pods -
# but it cannot read Secrets anywhere, so a compromise of lab-service does not
# hand over database credentials.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-service
  namespace: learning-platform
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/lp-lab-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lp-lab-manager
rules:
  - apiGroups: ['']
    resources: [namespaces]
    verbs: [create, get, list, delete, watch]
  - apiGroups: ['']
    resources: [pods, pods/status]
    verbs: [create, get, list, delete, watch]
  - apiGroups: ['']
    # exec is how the terminal attaches. It is also the most dangerous verb in
    # this file, which is why lab-service runs in its own cluster in production.
    resources: [pods/exec]
    verbs: [create, get]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  - apiGroups: ['']
    resources: [resourcequotas, limitranges]
    verbs: [create, get, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, get, delete]
  # Deliberately absent: secrets, configmaps, serviceaccounts, deployments,
  # nodes, and anything in the learning-platform namespace itself.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lp-lab-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lp-lab-manager
subjects:
  - kind: ServiceAccount
    name: lab-service
    namespace: learning-platform
---
# Every other service: an identity for IRSA, and no Kubernetes API rights.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: media-service
  namespace: learning-platform
  annotations:
    # Read-only access to the media bucket and permission to sign; nothing else.
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/lp-media-service
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  namespace: learning-platform
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/lp-notification-service
automountServiceAccountToken: false
