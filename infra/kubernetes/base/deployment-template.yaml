# ---------------------------------------------------------------------------
# The shape every service Deployment follows. `kustomize` patches the name,
# image, port and env per service; this file documents the decisions once.
#
# Read the comments as the rationale for the whole fleet, not just this file.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: SERVICE_NAME
  namespace: learning-platform
  labels:
    app.kubernetes.io/name: SERVICE_NAME
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: learning-platform
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never go below the current replica count during a deploy: with
      # maxUnavailable > 0 and two replicas you serve a release from a single
      # pod, and a crash there is an outage.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: SERVICE_NAME
  template:
    metadata:
      labels:
        app.kubernetes.io/name: SERVICE_NAME
        app.kubernetes.io/component: service
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '4000'
        prometheus.io/path: '/metrics'
    spec:
      serviceAccountName: SERVICE_NAME
      # IRSA gives the pod an IAM role; it does not need the node's role, and
      # it must not be able to fall back to it.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # Spread replicas across availability zones so losing one AZ loses half
      # the capacity, not all of it.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: SERVICE_NAME }
      containers:
        - name: SERVICE_NAME
          image: REGISTRY/lp/SERVICE_NAME:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 4000 }
          envFrom:
            - configMapRef: { name: platform-config }
            # Populated by External Secrets from AWS Secrets Manager; no secret
            # values live in git or in a manifest.
            - secretRef: { name: platform-secrets }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          # startup gates the other two, so a slow first boot (Prisma connecting,
          # JIT warming) does not get the pod killed by liveness.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            # readyz checks the database. A pod that cannot reach Aurora should
            # leave the Service endpoints rather than serve 500s.
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            # healthz is deliberately shallow: restarting a pod does not fix a
            # database outage, it just removes capacity during one.
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # Give the load balancer time to stop sending new connections
              # before the process starts refusing them.
              exec: { command: ['sh', '-c', 'sleep 5'] }
      terminationGracePeriodSeconds: 45
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: SERVICE_NAME
  namespace: learning-platform
spec:
  selector:
    app.kubernetes.io/name: SERVICE_NAME
  ports:
    - { name: http, port: 4000, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: SERVICE_NAME
  namespace: learning-platform
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: SERVICE_NAME }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } }
  behavior:
    scaleDown:
      # Scale down slowly: flapping replicas cost more in cold starts than the
      # idle capacity they save.
      stabilizationWindowSeconds: 300
      policies: [{ type: Percent, value: 50, periodSeconds: 60 }]
    scaleUp:
      stabilizationWindowSeconds: 30
      policies: [{ type: Percent, value: 100, periodSeconds: 30 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: SERVICE_NAME
  namespace: learning-platform
spec:
  # Voluntary disruptions (node drains, cluster upgrades) may never take the
  # last pod. With minAvailable: 1 a two-replica service survives a drain.
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: SERVICE_NAME }
