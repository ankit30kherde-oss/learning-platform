apiVersion: v1
kind: Namespace
metadata:
  name: learning-platform
  labels:
    app.kubernetes.io/part-of: learning-platform
    # Platform workloads run under the restricted Pod Security Standard. Labs
    # live in their own generated namespaces (see lab-service) and never here.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform-quota
  namespace: learning-platform
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "60"
