# ---------------------------------------------------------------------------
# Secrets come from AWS Secrets Manager at runtime via External Secrets
# Operator. Nothing sensitive is committed, and rotating a value in Secrets
# Manager propagates without a redeploy.
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: learning-platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef: { name: external-secrets }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-secrets
  namespace: learning-platform
spec:
  refreshInterval: 15m
  secretStoreRef: { name: aws-secrets, kind: SecretStore }
  target:
    name: platform-secrets
    creationPolicy: Owner
  dataFrom:
    - extract: { key: lp/production/platform }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: learning-platform
data:
  NODE_ENV: production
  AUTH_SERVICE_URL: http://auth-service:4000
  COURSE_SERVICE_URL: http://course-service:4000
  ENROLLMENT_SERVICE_URL: http://enrollment-service:4000
  PAYMENT_SERVICE_URL: http://payment-service:4000
  MEDIA_SERVICE_URL: http://media-service:4000
  LAB_SERVICE_URL: http://lab-service:4000
  QUIZ_SERVICE_URL: http://quiz-service:4000
  CERT_SERVICE_URL: http://certificate-service:4000
  NOTIFICATION_SERVICE_URL: http://notification-service:4000
  MEDIA_DRIVER: cloudfront
  LAB_DRIVER: kubernetes
  COOKIE_SECURE: 'true'
  COOKIE_SAMESITE: lax
