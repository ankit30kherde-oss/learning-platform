# Prometheus Operator discovery for every platform service.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: learning-platform
  namespace: learning-platform
  labels: { release: kube-prometheus-stack }
spec:
  namespaceSelector: { matchNames: [learning-platform] }
  selector:
    matchLabels: { app.kubernetes.io/part-of: learning-platform }
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: learning-platform-alerts
  namespace: learning-platform
  labels: { release: kube-prometheus-stack }
spec:
  groups:
    - name: learning-platform.slo
      rules:
        # Alert on symptoms students feel, not on causes. "CPU is high" is not
        # an incident; "one in twenty checkouts fails" is.
        - alert: HighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="learning-platform",status=~"5.."}[5m]))
            / sum(rate(http_requests_total{namespace="learning-platform"}[5m])) > 0.02
          for: 10m
          labels: { severity: critical }
          annotations:
            summary: 'More than 2% of requests are failing'
            runbook: 'docs/runbooks/high-error-rate.md'

        - alert: PaymentFailureSpike
          expr: |
            sum(rate(payments_failed_total[15m])) / sum(rate(payments_attempted_total[15m])) > 0.1
          for: 15m
          labels: { severity: critical }
          annotations:
            summary: 'Over 10% of payment attempts are failing - check Razorpay status'

        - alert: WebhookBacklog
          expr: lp_webhook_events_unprocessed > 20
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: 'Razorpay webhooks are not being processed - students may have paid without enrolling'

        - alert: LabSessionsNotReaping
          expr: lp_lab_sessions_running > 50 and rate(lp_lab_sessions_ended_total[30m]) == 0
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: 'Lab sessions are accumulating without being destroyed - check the reaper'

        - alert: ApiLatencyP95
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_seconds_bucket{namespace="learning-platform"}[5m])) by (le)
            ) > 1
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: 'p95 API latency above one second'
