apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: learning-platform

resources:
  - ../../base

configMapGenerator:
  - name: platform-config
    behavior: merge
    literals:
      - NODE_ENV=production
      - APP_PUBLIC_URL=https://devopsacademy.example.com

patches:
  # Payment and auth take the most traffic at peak and are the least tolerable
  # to lose, so they get more headroom than the defaults.
  - target: { kind: HorizontalPodAutoscaler, name: auth-service }
    patch: |
      - op: replace
        path: /spec/maxReplicas
        value: 20
  - target: { kind: HorizontalPodAutoscaler, name: api-gateway }
    patch: |
      - op: replace
        path: /spec/maxReplicas
        value: 30
