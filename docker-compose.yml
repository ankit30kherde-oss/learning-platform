services:
  postgres:
    image: postgres:17-alpine
    container_name: lp-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: lp
      POSTGRES_PASSWORD: lp_password
      POSTGRES_DB: postgres

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lp -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  redis:
    image: redis:7-alpine
    container_name: lp-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "6379:6379"

    volumes:
      - redisdata:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s


  mailhog:
    image: mailhog/mailhog:latest
    container_name: lp-mailhog
    restart: unless-stopped

    ports:
      - "1025:1025"
      - "8025:8025"


  minio:
    image: chrislusf/seaweedfs:latest
    container_name: lp-minio
    restart: unless-stopped

    command:
      - server
      - -s3
      - -s3.port=9000
      - -s3.config=/etc/seaweedfs/s3.json

    ports:
      - "9000:9000"
      - "9333:9333"
      - "8888:8888"

    volumes:
      - miniodata:/data
      - ./infra/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:9333/cluster/status >/dev/null 2>&1 || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s


volumes:
  pgdata:
  redisdata:
  miniodata:
